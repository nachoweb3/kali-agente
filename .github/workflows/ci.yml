name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[dev]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts --select F
      - run: python -m pytest -q
      - run: python -m build
      - run: kali-agente --help
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/kali-release-wheel
          /tmp/kali-release-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/kali-release-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_release.py"
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell launchers
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
